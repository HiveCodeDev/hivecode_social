<!doctype html><html lang="pt"><head><meta charset="utf-8">
<style>@import url('https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;700&display=block');

@import url('https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=block');
:root{--night:#121125;--deep:#16132f;--ink:#f3f1fb;--soft:#c9c3e6;--muted:#9a93c0;
--pink:#EF5AFE;--violet:#D752FE;--blue:#4877FE;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:'Geologica',sans-serif;position:relative}
.hex{position:absolute;inset:0;opacity:.5}
.glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.45}
.frame{position:absolute;inset:0;padding:96px 88px;display:flex;flex-direction:column}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:24px;font-weight:500;letter-spacing:.14em;
text-transform:uppercase;color:var(--soft)}
.eyebrow i{width:14px;height:14px;transform:rotate(30deg);background:linear-gradient(135deg,var(--pink),var(--blue));
clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
h1{font-weight:600;font-size:84px;line-height:1.04;letter-spacing:-.025em;margin-top:40px;text-wrap:balance}
h1 em{font-style:normal;color:var(--violet)}
p.lead{font-size:34px;line-height:1.4;color:var(--soft);font-weight:300;margin-top:32px;max-width:860px}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.content>.eyebrow{align-self:flex-start}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:26px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:16px;font-weight:600;font-size:30px;color:var(--ink)}
.brand img{width:52px;height:52px}
.shot{border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
box-shadow:0 40px 90px -30px rgba(72,119,254,.55);background:#000}
.shot .bar{height:44px;background:#1d1a3a;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:19px;color:var(--muted)}
.shot .bar b{width:12px;height:12px;border-radius:50%;background:#3a3566}
.shot .bar span{margin-left:14px}
.shot img{display:block;width:100%}

html,body{width:1080px;height:1920px}
.top{position:absolute;left:88px;right:88px;top:150px;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--muted);z-index:5}
.txt{position:absolute;left:88px;width:904px;top:300px;font-weight:600;line-height:1.08;letter-spacing:-.025em;z-index:4}
.txt .w{display:inline-block;opacity:0;margin-right:.24em}
.txt .w.em{color:var(--violet)}
#art{position:absolute;inset:0;transform-origin:540px 1140px}
#art>*{position:absolute}

:root{--night:#120B1F;--deep:#120B1F;--ink:#F1ECFF;--soft:#c5b8e6;--muted:#8a7bb0;
--violet:#9BFF5B;--pink:#9BFF5B;--blue:#9BFF5B}
body{background:#120B1F;color:#F1ECFF}
.brand{color:#F1ECFF}.brand img{}
.glow,.hex{display:none}

.top{display:none}
.txt{top:430px;line-height:1}
#arrow{left:70px;top:150px;display:flex;align-items:center;gap:20px;padding:20px 30px 20px 22px;border-radius:999px;font-size:38px;font-weight:800;opacity:0;z-index:9}
#arrow svg{width:56px;height:56px}
.peek{border-radius:30px;overflow:hidden;box-shadow:0 50px 100px -30px rgba(0,0,0,.6)}
.peek img{display:block;width:100%}
#arrow{background:#9BFF5B;color:#120B1F}#moon{left:720px;top:760px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffbe6,#f3e9b8 60%,#d8c98a);box-shadow:0 0 120px 40px rgba(243,233,184,.25)}
#gh{left:150px;top:1050px;opacity:0}#pump{left:560px;top:1100px;font-size:280px;opacity:0;filter:drop-shadow(0 0 60px rgba(255,140,40,.6))}
#flash{inset:0;background:#e9e3ff;opacity:0;z-index:8}</style></head><body>
<span class="glow" style="width:720px;height:720px;left:-220px;top:-160px;background:#4877FE"></span>
<span class="glow" style="width:680px;height:680px;right:-260px;bottom:260px;background:#D752FE"></span>
<div class="top"><span class="brand"><img src="file:///C:/Users/saloc/Documents/hivecode_social/assets/logo_mark.svg" alt="">HiveCode</span><span>hivecode.pt</span></div>
<div class="txt" style="font-size:160px"><span class="w" data-s="0.300">Feliz</span><span class="w em" data-s="0.560">Halloween</span><span class="w" data-s="0.820">🎃</span></div><div class="txt" style="font-size:96px"><span class="w" data-s="3.300">Que</span><span class="w" data-s="3.560">o</span><span class="w" data-s="3.820">único</span><span class="w" data-s="4.080">susto</span><span class="w" data-s="4.340">seja</span><span class="w" data-s="4.600">o</span><span class="w" data-s="4.860">da</span><span class="w em" data-s="5.120">concorrência.</span></div><div id="art"><span id="moon"></span><span id="b0"><svg viewBox="0 0 100 40" width="150" height="60.0"><path d="M50 14c-3-6-7-6-8 0-6-8-18-10-30-6 8 2 12 8 12 16 4-4 10-4 14 0 2-4 6-6 12-4 6-2 10 0 12 4 4-4 10-4 14 0 0-8 4-14 12-16-12-4-24-2-30 6-1-6-5-6-8 0z" fill="#05020b"/></svg></span><span id="b1"><svg viewBox="0 0 100 40" width="100" height="40.0"><path d="M50 14c-3-6-7-6-8 0-6-8-18-10-30-6 8 2 12 8 12 16 4-4 10-4 14 0 2-4 6-6 12-4 6-2 10 0 12 4 4-4 10-4 14 0 0-8 4-14 12-16-12-4-24-2-30 6-1-6-5-6-8 0z" fill="#05020b"/></svg></span><span id="b2"><svg viewBox="0 0 100 40" width="80" height="32.0"><path d="M50 14c-3-6-7-6-8 0-6-8-18-10-30-6 8 2 12 8 12 16 4-4 10-4 14 0 2-4 6-6 12-4 6-2 10 0 12 4 4-4 10-4 14 0 0-8 4-14 12-16-12-4-24-2-30 6-1-6-5-6-8 0z" fill="#05020b"/></svg></span>
<span id="gh"><svg viewBox="0 0 80 90" width="280" height="314"><path d="M8 88V38a32 32 0 0 1 64 0v50l-10.6-9-10.7 9-10.7-9-10.7 9-10.6-9z" fill="#EDE7FF" opacity=".92"/><ellipse cx="28" cy="38" rx="6" ry="9" fill="#120B1F"/><ellipse cx="52" cy="38" rx="6" ry="9" fill="#120B1F"/><ellipse cx="40" cy="60" rx="7" ry="9" fill="#120B1F"/></svg></span><span id="pump">🎃</span><span id="flash"></span><div id="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 17 7 7M16 7H7v9"/></svg>Reel novo no perfil</div></div>
<script>
const T = {"ev": {}, "scenes": [{"start": 0, "end": 3.1}, {"start": 3.1, "end": 7.0}]}, E = T.ev;
const cl = x => Math.min(Math.max(x, 0), 1);
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const blocks = $$('.txt'), glows = $$('.glow');
// Shows an element from `a` (pops in) until `b` (slides out left); returns visibility 0..1.
function stage(el, t, a, b, dist = 60) {
  const k = back((t - a) / .5), o = ease((t - b) / .3);
  el.style.opacity = cl((t - a) / .12) * (1 - o);
  el.style.transform = `translate(${-160 * o}px,${dist * (1 - k)}px) scale(${.92 + .08 * k})`;
  return cl((t - a) / .12) * (1 - o);
}
function pop(el, t, a, base = '') {
  const k = back((t - a) / .45);
  el.style.opacity = cl((t - a) / .1);
  el.style.transform = `${base} scale(${k})`;
}

function arrowAt(t, a) {
  const el = $('#arrow'), k = back((t - a) / .45);
  el.style.opacity = cl((t - a) / .1);
  el.style.transform = `translate(${-14 * Math.max(0, Math.sin((t - a) * 6))}px,${-14 * Math.max(0, Math.sin((t - a) * 6))}px) scale(${k})`;
}
function art(t, E) {
[[0, 0, 660], [1, .8, 820], [2, 1.6, 740]].forEach(([i, d, y]) => { const p = ((t - d) * .27) % 1.4 - .2; $('#b' + i).style.transform = `translate(${-200 + p * 1400}px,${y + 40 * Math.sin((t - d) * 3)}px) scaleY(${.7 + .3 * Math.abs(Math.sin(t * 14 + i))})`; $('#b' + i).style.opacity = t > d ? 1 : 0; });
$('#flash').style.opacity = Math.max(.55 * Math.max(0, 1 - Math.abs(t - .1) / .09), .3 * Math.max(0, 1 - Math.abs(t - .32) / .07), .5 * Math.max(0, 1 - Math.abs(t - 3.1) / .09));
const g = $('#gh'); g.style.opacity = .9 * cl((t - .8) / .4); g.style.transform = `translate(${40 * Math.sin(t * 1.6)}px,${30 * Math.sin(t * 2.3)}px)`;
pop($('#pump'), t, 1.4);
arrowAt(t, 5.0);
}
window.seek = t => {
  glows[0].style.transform = `translate(${40 * Math.sin(t * .5)}px,${30 * Math.cos(t * .4)}px)`;
  glows[1].style.transform = `translate(${-50 * Math.sin(t * .35)}px,${40 * Math.cos(t * .45)}px)`;
  T.scenes.forEach((s, i) => {
    const b = blocks[i], last = i === T.scenes.length - 1, out = last ? 0 : ease((t - s.end) / .25);
    b.style.display = t >= s.start && (t < s.end + .25 || last) ? 'block' : 'none';
    b.style.opacity = 1 - out;
    b.style.transform = `translateY(${-70 * out}px)`;
    b.querySelectorAll('.w').forEach(w => {
      const k = back((t - +w.dataset.s + .08) / .32);
      w.style.opacity = cl((t - +w.dataset.s + .08) / .1);
      w.style.transform = `translateY(${34 * (1 - k)}px) scale(${.88 + .12 * k})`;
    });
  });
  $('#art').style.transform = `scale(${1.02 + .02 * Math.sin(t * .6)})`;
  art(t, E);
  // Real-video background: one pre-extracted frame per video frame; wait until it is drawn.
  if (T.bg) {
    const img = $('#bg'), src = `${T.bg.dir}/${String(Math.min(T.bg.n, Math.round(t * 30) + 1)).padStart(5, '0')}.jpg`;
    if (img.getAttribute('src') !== src) { img.src = src; return img.decode().catch(() => {}); }
  }
};
seek(0);
</script>
