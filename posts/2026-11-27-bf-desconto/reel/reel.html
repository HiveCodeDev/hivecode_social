:root{--night:#121125;--deep:#16132f;--ink:#f3f1fb;--soft:#c9c3e6;--muted:#9a93c0;

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:'Geologica',sans-serif;position:relative}
.hex{position:absolute;inset:0;opacity:.5}
.glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.45}

clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

.shot .bar b{width:12px;height:12px;border-radius:50%;background:#3a3566}
.shot .bar span{margin-left:14px}
.shot img{display:block;width:100%}

html,body{width:1080px;height:1920px}
.top{position:absolute;left:88px;right:88px;top:150px;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--muted);z-index:5}

.txt .w.em{color:var(--violet)}

#bar{height:76px;background:#f1f1f1;display:flex;align-items:center;gap:12px;padding:0 28px}

<div class="txt" style="font-size:130px"><span class="w em" data-s="0.100">Black</span><span class="w em" data-s="0.350">Friday</span><span class="w" data-s="0.700">na</span><span class="w" data-s="0.812">HiveCode.</span></div><div class="txt" style="font-size:104px"><span class="w em" data-s="2.325">20%</span><span class="w" data-s="3.138">de</span><span class="w" data-s="3.237">desconto</span><span class="w" data-s="3.587">na</span><span class="w" data-s="3.700">criação</span><span class="w" data-s="4.112">do</span><span class="w" data-s="4.250">seu</span><span class="w" data-s="4.412">site.</span></div><div class="txt" style="font-size:88px"><span class="w" data-s="5.675">Para</span><span class="w" data-s="5.838">orçamentos</span><span class="w" data-s="6.350">pedidos</span><span class="w" data-s="6.713">até</span><span class="w em" data-s="6.912">domingo,</span><span class="w" data-s="7.525">29</span><span class="w" data-s="7.525">de</span><span class="w" data-s="7.525">novembro.</span></div><div class="txt" style="font-size:96px"><span class="w" data-s="9.537">O</span><span class="w" data-s="9.625">mockup</span><span class="w" data-s="10.037">e</span><span class="w" data-s="10.137">o</span><span class="w" data-s="10.175">orçamento</span><span class="w" data-s="10.662">continuam</span><span class="w em" data-s="11.050">gratuitos.</span></div><div class="txt" style="font-size:110px"><span class="w" data-s="12.512">Peça</span><span class="w" data-s="12.787">o</span><span class="w" data-s="12.900">seu</span><span class="w" data-s="13.012">em</span><span class="w em" data-s="13.113">hivecode.pt.</span></div><div id="art"><div id="win"><div id="bar"><i></i><i></i><i></i></div><span class="wb" id="w0" style="left:30px;right:30px;top:100px;height:56px"></span><span class="wb" id="w1" style="left:30px;right:30px;top:180px;height:200px"></span><span class="wb" id="w2" style="left:30px;width:380px;top:404px;height:30px"></span><span class="wb" id="w3" style="left:30px;width:260px;top:454px;height:60px"></span></div><div id="stamp">−20%</div><div id="date"><span>até domingo, 29/11</span></div><div id="free"><span>Mockup e orçamento<b>0 €</b></span></div><img id="logo" src="file:///C:/Users/Gon%C3%A7alo/Documents/hivecode_social/assets/logo_mark.svg" alt=""><div id="cta"><span>hivecode.pt</span></div></div>
<script>
const T = {"ev": {"pct": 2.325, "dom": 6.9125, "s4": 9.387, "s5": 12.362, "site": 13.1125}, "scenes": [{"start": 0, "end": 2.175}, {"start": 2.175, "end": 5.525}, {"start": 5.525, "end": 9.387}, {"start": 9.387, "end": 12.362}, {"start": 12.362, "end": 16.592}]}, E = T.ev;
const cl = x => Math.min(Math.max(x, 0), 1);
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const blocks = $$('.txt'), glows = $$('.glow');
// Shows an element from `a` (pops in) until `b` (slides out left); returns visibility 0..1.
function stage(el, t, a, b, dist = 60) {
  const k = back((t - a) / .5), o = ease((t - b) / .3);
  el.style.opacity = cl((t - a) / .12) * (1 - o);
  el.style.transform = `translate(${-160 * o}px,${dist * (1 - k)}px) scale(${.92 + .08 * k})`;
  return cl((t - a) / .12) * (1 - o);
}
function pop(el, t, a, base = '') {
  const k = back((t - a) / .45);
  el.style.opacity = cl((t - a) / .1);
  el.style.transform = `${base} scale(${k})`;
}

function art(t, E) {
  stage($('#win'), t, .3, E.s4 + .6);
  [0, 1, 2, 3].forEach(i => { const el = $('#w' + i), a = .5 + .15 * i;
    el.style.opacity = cl((t - a) / .15);
    el.style.background = t > E.pct ? (i === 1 ? 'linear-gradient(150deg,#fff3a6,#FFD400)' : i === 3 ? '#0A0A0A' : '#ececec') : '#ececec'; });
  const s = $('#stamp'); s.style.opacity = cl((t - E.pct) / .08) * (1 - cl((t - E.s4 - .4) / .3));
  s.style.transform = `rotate(-10deg) scale(${1 + 1.6 * (1 - ease((t - E.pct) / .3))})`;
  stage($('#date'), t, E.dom, E.s4 - .1);
  stage($('#free'), t, E.s4, E.s5 - .1);
  const lg = back((t - E.s5 - .1) / .5);
  $('#logo').style.opacity = cl((t - E.s5 - .1) / .1);
  $('#logo').style.transform = `rotate(${-120 * (1 - lg)}deg) scale(${lg})`;
  const ct = back((t - E.site) / .45);
  $('#cta').style.opacity = cl((t - E.site) / .1);
  $('#cta').style.transform = `scale(${ct})`;
}

window.seek = t => {
  glows[0].style.transform = `translate(${40 * Math.sin(t * .5)}px,${30 * Math.cos(t * .4)}px)`;
  glows[1].style.transform = `translate(${-50 * Math.sin(t * .35)}px,${40 * Math.cos(t * .45)}px)`;
  T.scenes.forEach((s, i) => {
    const b = blocks[i], last = i === T.scenes.length - 1, out = last ? 0 : ease((t - s.end) / .25);
    b.style.display = t >= s.start && (t < s.end + .25 || last) ? 'block' : 'none';
    b.style.opacity = 1 - out;
    b.style.transform = `translateY(${-70 * out}px)`;
    b.querySelectorAll('.w').forEach(w => {
      const k = back((t - +w.dataset.s + .08) / .32);
      w.style.opacity = cl((t - +w.dataset.s + .08) / .1);
      w.style.transform = `translateY(${34 * (1 - k)}px) scale(${.88 + .12 * k})`;
    });
  });
  $('#art').style.transform = `scale(${1.02 + .02 * Math.sin(t * .6)})`;
  art(t, E);
  // Real-video background: one pre-extracted frame per video frame; wait until it is drawn.
  if (T.bg) {
    const img = $('#bg'), src = `${T.bg.dir}/${String(Math.min(T.bg.n, Math.round(t * 30) + 1)).padStart(5, '0')}.jpg`;
    if (img.getAttribute('src') !== src) { img.src = src; return img.decode().catch(() => {}); }
  }
};
seek(0);
</script>
