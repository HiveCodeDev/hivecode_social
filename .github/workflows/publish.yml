name: Publicar no Instagram

# GitHub's cron is best effort (on 25/11 it ran twice in 24 h), so a real run stays alive for ~5 h,
# checking every 5 minutes (tools/publish_due.mjs + commit of media_id/permalink), then starts the
# next run itself; workflow_dispatch from GITHUB_TOKEN does start new runs. The cron only restarts
# the chain if it breaks. A dry run is one single check.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só verificar (não publica)"
        type: boolean
        default: true

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o que estiver na hora (ciclo de ~5 h)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: "17841422279593509"
          INSTAGRAM_API_VERSION: v26.0
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          git config user.name "HiveCodeDev"
          git config user.email "HiveCodeDev@users.noreply.github.com"
          end=$((SECONDS + 5*3600 + 15*60)); failed=0
          while :; do
            git pull --rebase -q || true
            node tools/publish_due.mjs $DRY || failed=1
            if ! git diff --quiet plans/; then
              git add plans/ && git commit -qm "Record published posts"
              pushed=0
              for i in 1 2 3; do git pull --rebase -q && git push -q && pushed=1 && break; sleep 5; done
              [ $pushed = 1 ] || failed=1
            fi
            [ -n "$DRY" ] || [ $SECONDS -ge $end ] && break
            sleep 300
          done
          exit $failed
      - name: Arrancar o ciclo seguinte
        if: always() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R ${{ github.repository }} -f dry_run=false
