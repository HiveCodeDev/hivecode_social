name: Publicar no Instagram

# Every 15 minutes, publish the approved posts whose Lisbon time has come (tools/publish_due.mjs),
# then commit the media_id/permalink back so nothing is ever posted twice.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só verificar (não publica)"
        type: boolean
        default: true

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o que estiver na hora
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: "17841422279593509"
          INSTAGRAM_API_VERSION: v26.0
        run: node tools/publish_due.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Guardar o registo da publicação
        if: always()
        run: |
          git diff --quiet plans/ && exit 0
          git config user.name "HiveCodeDev"
          git config user.email "HiveCodeDev@users.noreply.github.com"
          git add plans/
          git commit -m "Record published posts"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
